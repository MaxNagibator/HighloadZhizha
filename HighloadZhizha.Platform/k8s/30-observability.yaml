apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: highload-zhizha
data:
  loki-config.yaml: |
    auth_enabled: false
    server: { http_listen_port: 3100 }
    common:
      path_prefix: /loki
      storage:
        filesystem: { chunks_directory: /loki/chunks, rules_directory: /loki/rules }
      replication_factor: 1
      ring: { kvstore: { store: inmemory } }
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index: { prefix: index_, period: 24h }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: highload-zhizha
spec:
  replicas: 1
  selector:
    matchLabels: { app: loki }
  template:
    metadata:
      labels: { app: loki }
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.7.0
          args: ["-config.file=/etc/loki/loki-config.yaml"]
          ports: [{ containerPort: 3100 }]
          readinessProbe: { httpGet: { path: /ready, port: 3100 }, initialDelaySeconds: 5, periodSeconds: 5 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/loki }
            - { name: data, mountPath: /loki }
      volumes:
        - name: config
          configMap: { name: loki-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: { name: loki, namespace: highload-zhizha }
spec:
  selector: { app: loki }
  ports: [{ port: 3100, targetPort: 3100 }]
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: prometheus, namespace: highload-zhizha }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: highload-zhizha-prometheus }
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: highload-zhizha-prometheus }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: highload-zhizha-prometheus }
subjects:
  - { kind: ServiceAccount, name: prometheus, namespace: highload-zhizha }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: prometheus-config, namespace: highload-zhizha }
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    scrape_configs:
      - job_name: kubernetes-cadvisor
        scheme: https
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
          - target_label: __address__
            replacement: kubernetes.default.svc:443
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus, namespace: highload-zhizha }
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=24h"]
          ports: [{ containerPort: 9090 }]
          readinessProbe: { httpGet: { path: /-/ready, port: 9090 }, initialDelaySeconds: 5, periodSeconds: 5 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: highload-zhizha }
spec:
  selector: { app: prometheus }
  ports: [{ port: 9090, targetPort: 9090 }]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: grafana-datasource, namespace: highload-zhizha }
data:
  loki.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        uid: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        isDefault: true
        editable: false
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata: { name: grafana-dashboard-provider, namespace: highload-zhizha }
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: HighloadZhizha
        orgId: 1
        folder: HighloadZhizha
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata: { name: grafana-highload-dashboard, namespace: highload-zhizha }
data:
  highload-zhizha.json: |
    {
      "uid": "highload-zhizha",
      "title": "HighloadZhizha — нагрузка и события",
      "tags": ["highload", "kafka", "sms"],
      "timezone": "browser",
      "schemaVersion": 41,
      "refresh": "5s",
      "time": { "from": "now-15m", "to": "now" },
      "panels": [
        {"id":1,"type":"stat","title":"Запросы нагрузчика","gridPos":{"x":0,"y":0,"w":6,"h":5},"datasource":{"type":"loki","uid":"Loki"},"targets":[{"refId":"A","expr":"sum(count_over_time({namespace=\"highload-zhizha\", app=\"management-service\"} |= \"LOAD_REQUEST\" [$__range])) or vector(0)","queryType":"instant"}]},
        {"id":2,"type":"stat","title":"Ошибки нагрузчика","gridPos":{"x":6,"y":0,"w":6,"h":5},"datasource":{"type":"loki","uid":"Loki"},"targets":[{"refId":"A","expr":"sum(count_over_time({namespace=\"highload-zhizha\", app=\"management-service\"} |= \"LOAD_REQUEST\" |= \"failed\" [$__range])) or vector(0)","queryType":"instant"}],"fieldConfig":{"defaults":{"color":{"mode":"fixed","fixedColor":"red"}}}},
        {"id":3,"type":"stat","title":"СМС отправлено","gridPos":{"x":12,"y":0,"w":6,"h":5},"datasource":{"type":"loki","uid":"Loki"},"targets":[{"refId":"A","expr":"sum(count_over_time({namespace=\"highload-zhizha\", app=\"notification-service\"} |= \"SMS_SENT\" [$__range])) or vector(0)","queryType":"instant"}],"fieldConfig":{"defaults":{"color":{"mode":"fixed","fixedColor":"green"}}}},
        {"id":4,"type":"stat","title":"События PaymentService","gridPos":{"x":18,"y":0,"w":6,"h":5},"datasource":{"type":"loki","uid":"Loki"},"targets":[{"refId":"A","expr":"sum(count_over_time({namespace=\"highload-zhizha\", app=\"payment-service\"} [$__range])) or vector(0)","queryType":"instant"}]},
        {"id":5,"type":"timeseries","title":"Запросы и СМС по времени","gridPos":{"x":0,"y":5,"w":24,"h":9},"datasource":{"type":"loki","uid":"Loki"},"targets":[{"refId":"A","expr":"sum(count_over_time({namespace=\"highload-zhizha\", app=\"management-service\"} |= \"LOAD_REQUEST\" [$__interval]))","legendFormat":"Запросы"},{"refId":"B","expr":"sum(count_over_time({namespace=\"highload-zhizha\", app=\"notification-service\"} |= \"SMS_SENT\" [$__interval]))","legendFormat":"SMS_SENT"}]},
        {"id":6,"type":"logs","title":"Последние SMS_SENT","gridPos":{"x":0,"y":14,"w":24,"h":10},"datasource":{"type":"loki","uid":"Loki"},"targets":[{"refId":"A","expr":"{namespace=\"highload-zhizha\", app=\"notification-service\"} |= \"SMS_SENT\""}],"options":{"showTime":true,"wrapLogMessage":true,"sortOrder":"Descending"}}
      ]
    }
  highload-resources.json: |
    {
      "uid": "highload-resources",
      "title": "HighloadZhizha — CPU и память",
      "tags": ["highload", "kubernetes", "resources"],
      "timezone": "browser",
      "schemaVersion": 41,
      "refresh": "5s",
      "time": { "from": "now-15m", "to": "now" },
      "panels": [
        {"id":1,"type":"stat","title":"CPU всех сервисов","gridPos":{"x":0,"y":0,"w":8,"h":5},"datasource":{"type":"prometheus","uid":"Prometheus"},"targets":[{"refId":"A","expr":"sum(rate(container_cpu_usage_seconds_total{namespace=\"highload-zhizha\", container!=\"\", image!=\"\"}[1m]))","instant":true}],"fieldConfig":{"defaults":{"unit":"cores","decimals":3}}},
        {"id":2,"type":"stat","title":"Память всех сервисов","gridPos":{"x":8,"y":0,"w":8,"h":5},"datasource":{"type":"prometheus","uid":"Prometheus"},"targets":[{"refId":"A","expr":"sum(container_memory_working_set_bytes{namespace=\"highload-zhizha\", container!=\"\", image!=\"\"})","instant":true}],"fieldConfig":{"defaults":{"unit":"bytes"}}},
        {"id":3,"type":"stat","title":"Контейнеров наблюдается","gridPos":{"x":16,"y":0,"w":8,"h":5},"datasource":{"type":"prometheus","uid":"Prometheus"},"targets":[{"refId":"A","expr":"count(container_memory_working_set_bytes{namespace=\"highload-zhizha\", container!=\"\", image!=\"\"})","instant":true}]},
        {"id":4,"type":"timeseries","title":"CPU по pod","gridPos":{"x":0,"y":5,"w":24,"h":9},"datasource":{"type":"prometheus","uid":"Prometheus"},"targets":[{"refId":"A","expr":"sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"highload-zhizha\", container!=\"\", image!=\"\"}[1m]))","legendFormat":"{{pod}}"}],"fieldConfig":{"defaults":{"unit":"cores","decimals":3}}},
        {"id":5,"type":"timeseries","title":"Рабочая память по pod","gridPos":{"x":0,"y":14,"w":24,"h":9},"datasource":{"type":"prometheus","uid":"Prometheus"},"targets":[{"refId":"A","expr":"sum by (pod) (container_memory_working_set_bytes{namespace=\"highload-zhizha\", container!=\"\", image!=\"\"})","legendFormat":"{{pod}}"}],"fieldConfig":{"defaults":{"unit":"bytes"}}},
        {"id":6,"type":"timeseries","title":"Использование memory limit по pod","gridPos":{"x":0,"y":23,"w":24,"h":9},"datasource":{"type":"prometheus","uid":"Prometheus"},"targets":[{"refId":"A","expr":"100 * sum by (pod) (container_memory_working_set_bytes{namespace=\"highload-zhizha\", container!=\"\", image!=\"\"}) / sum by (pod) (container_spec_memory_limit_bytes{namespace=\"highload-zhizha\", container!=\"\", image!=\"\", container_spec_memory_limit_bytes>0})","legendFormat":"{{pod}}"}],"fieldConfig":{"defaults":{"unit":"percent","min":0,"max":100}}}
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana, namespace: highload-zhizha }
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.1.1
          ports: [{ containerPort: 3000 }]
          env:
            - { name: GF_SECURITY_ADMIN_USER, value: admin }
            - { name: GF_SECURITY_ADMIN_PASSWORD, value: admin }
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer }
          readinessProbe: { httpGet: { path: /api/health, port: 3000 }, initialDelaySeconds: 10, periodSeconds: 5 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: datasource, mountPath: /etc/grafana/provisioning/datasources }
            - { name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
      volumes:
        - name: datasource
          configMap: { name: grafana-datasource }
        - name: dashboard-provider
          configMap: { name: grafana-dashboard-provider }
        - name: dashboards
          configMap: { name: grafana-highload-dashboard }
---
apiVersion: v1
kind: Service
metadata: { name: grafana, namespace: highload-zhizha }
spec:
  selector: { app: grafana }
  ports: [{ port: 3000, targetPort: 3000 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: grafana, namespace: highload-zhizha }
spec:
  rules:
    - host: grafana.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: grafana, port: { number: 3000 } }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: alloy, namespace: highload-zhizha }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: highload-zhizha-alloy }
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: highload-zhizha-alloy }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: highload-zhizha-alloy }
subjects:
  - { kind: ServiceAccount, name: alloy, namespace: highload-zhizha }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: alloy-config, namespace: highload-zhizha }
data:
  config.alloy: |
    logging {
      level  = "info"
      format = "json"
    }

    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "app"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pod_logs.output
      forward_to = [loki.write.default.receiver]
    }

    loki.write "default" {
      endpoint {
        url = "http://loki:3100/loki/api/v1/push"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: alloy, namespace: highload-zhizha }
spec:
  replicas: 1
  selector:
    matchLabels: { app: alloy }
  template:
    metadata:
      labels: { app: alloy }
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.11.3
          args: ["run", "/etc/alloy/config.alloy", "--server.http.listen-addr=0.0.0.0:12345"]
          ports: [{ containerPort: 12345 }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 256Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/alloy }
      volumes:
        - name: config
          configMap: { name: alloy-config }
