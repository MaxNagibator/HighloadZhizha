apiVersion: apps/v1
kind: Deployment
metadata:
  name: green-bank-service
  namespace: highload-zhizha
spec:
  replicas: 2
  selector:
    matchLabels: { app: green-bank-service }
  template:
    metadata:
      labels: { app: green-bank-service }
    spec:
      containers:
        - name: green-bank-service
          image: highload/green-bank-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 8080 }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: app-secrets, key: DATABASE_URL_GO } }
          envFrom:
            - configMapRef: { name: app-config }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 500m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: green-bank-service
  namespace: highload-zhizha
spec:
  selector: { app: green-bank-service }
  ports:
    - { port: 80, targetPort: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: green-bank-service
  namespace: highload-zhizha
spec:
  rules:
    - http:
        paths:
          - path: /accounts
            pathType: Prefix
            backend:
              service: { name: green-bank-service, port: { number: 80 } }
          - path: /health
            pathType: Exact
            backend:
              service: { name: green-bank-service, port: { number: 80 } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: highload-zhizha
spec:
  replicas: 1
  selector:
    matchLabels: { app: payment-service }
  template:
    metadata:
      labels: { app: payment-service }
    spec:
      containers:
        - name: payment-service
          image: highload/payment-service:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: app-secrets, key: DATABASE_URL_DOTNET } }
          envFrom:
            - configMapRef: { name: app-config }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-zhorka
  namespace: highload-zhizha
spec:
  replicas: 1
  selector:
    matchLabels: { app: memory-zhorka }
  template:
    metadata:
      labels: { app: memory-zhorka }
    spec:
      containers:
        - name: memory-zhorka
          image: highload/memory-zhorka:dev
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 500m, memory: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: memory-zhorka
  namespace: highload-zhizha
spec:
  selector: { app: memory-zhorka }
  ports:
    - { port: 80, targetPort: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: memory-zhorka
  namespace: highload-zhizha
spec:
  rules:
    - host: memory.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: memory-zhorka, port: { number: 80 } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: highload-zhizha
spec:
  replicas: 1
  selector:
    matchLabels: { app: notification-service }
  template:
    metadata:
      labels: { app: notification-service }
    spec:
      containers:
        - name: notification-service
          image: highload/notification-service:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: app-config }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 300m, memory: 256Mi }
